/*
===========================================================================
 rtgl-debug.cfg - P2 / P2.5 / P4 debug pins for the RTGL1 backend.

 Apply from the launcher with:  +exec rtgl-debug.cfg

 Intentionally NOT auto-loaded and not the shared DoomConfig.cfg / dhewm.cfg.
 All rt_dbg_* / rt_light_* / rt_sun_* / rt_sky_* / rt_bounce_* / rt_gi_*
 cvars are non-ARCHIVE, so nothing here is persisted into the per-user config
 and nothing leaks into the stock OpenGL backend.

 Note: Doom 3 config files only understand slash-star comments.

 See rt/RTGL1.json developerMode + RTGL1's own ImGui debug panel for the
 free debug layer (ALBEDO_WHITE / NORMALS / MOTION_VECTORS / GRADIENTS).
 The engine-side layer below complements it.
===========================================================================
*/

/* --- ID / geometry validation --- */
set rt_dbg_validateIDs 1      /* report duplicate uniqueObjectID per frame */
set rt_dbg_stats 60           /* print geo+light stats every 60 frames, 0 = off */
set rt_dbg_dumpLights 0     /* (C) per-light list every 60 frames, nearest-first + d=dist-to-cam + world aabb; view with win_viewlog 1 */
set rt_dbg_printRepeat 300     /* suppress repeated RTGL1 log messages: print 1st, then every 300 (0 = no throttle) */

/* --- per-primitive debug coloring (engine-side override of albedo) --- */
/* 0 normal (white, real textures show through) */
/* 1 uniqueObjectID hash   2 static=green / dynamic=red */
/* 3 primIndex hash        4 entityDef index hash   5 material name hash */
set rt_dbg_colorMode 0

/* --- geometry submission controls --- */
set rt_dbg_skipSubViews 1     /* skip mirror/camera/xray subview geometry (P5) */
set rt_dbg_maxSurfs 0         /* 0 = unlimited; cap for perf bisect */
set rt_dbg_bounds 0           /* reserved: rasterized AABB/normal overlay (P5) */

/* --- P4: light-source visualization (A) + enhanced dump (C) --- */
/* (A) rt_dbg_lightViz draws each sphere/spot light as in-scene geometry at  */
/*     its TRUE uploaded radius (after rt_light_radiusScale). Walls occlude  */
/*     it and it follows the camera. Directional lights have no finite bound */
/*     and are not drawn. Emissive look is a runtime visual check.           */
set rt_dbg_lightViz 0        /* 0 off, 1 solid emissive sphere, 2 wireframe rings */

/* --- P3: multiply-blend decals (scorch/grime) --- */
/* Doom 3 decal TGAs are 24-bit (NO alpha): transparency is encoded in RGB */
/* via multiply blends (white=transparent). rt_decal_mode=1 BAKES a       */
/* coverage alpha from RGB so RTGL1 alpha-test can discard identity       */
/* texels. 0 legacy, 1 baked-alpha cutout (default), 2 skip, 3 DECAL      */
/* overlay. Detection is by blend bits (catches 'sort 1' decals too).     */
/* NOTE: code defaults already apply without this cfg.                      */
set rt_decal_mode 1
set rt_emissive_enable 1      /* 1 = enable screen-space glow on blend-add light fixtures (emissionMapBoost=2 keeps GI clean) */
set rt_emissive_mult 1.0     /* fixture surface glow multiplier */
set rt_normalmap_enable 1    /* bind Doom3 bump maps as in-memory normal maps (Plan B) */

/* --- P-UI: in-game 2D / console / HUD composition (Plan B, 2026-11-14) --- */
/* GUI quads from 2D views (viewEntitys==NULL) are uploaded as RTGL1        */
/* swapchained translucent primitives; the swapchain rasterizer lives in    */
/* the DLL (RsRasterizer.vert.spv / RsSwapchain.frag.spv) and draws on top  */
/* of the ray-traced image via DrawToSwapchain (LOAD, not CLEAR).           */
/* NOTE: code defaults already apply without this cfg.                      */
set rt_ui_enable 1           /* 0 disables the in-game UI overlay */
set rt_ui_flipY 0            /* set 1 if the UI renders vertically flipped */
set rt_ui_worldGuis 1        /* in-world interactive GUIs (terminals/keypads/security screens) */
set rt_ui_worldGuisMode 1    /* 1 = WORLD raster, depth-tested vs scene (fix for GUI showing through characters); 0 = old no-depth overlay */
set rt_ui_worldGuisDepthBias 0.002 /* fraction of view ray to pull GUI toward camera (co-planar wall) */
set rt_ui_worldGuisFlipY 0   /* swapchain-mode only: set 1 if in-world GUI renders vertically flipped */

/* --- Iris / eyeball (DFRM_EYEBALL) WORLD-raster fix (2026-11-14) --- */
/* Eye materials are translucent multiply-blend decals coplanar with the    */
/* eyeball. rt_decal_mode=1 baked them to alpha cutouts but classified them  */
/* as ray-traced BLAS, where the head/eyeball wins the primary hit -> all     */
/* white eyes. rt_eye_worldRaster routes them to the WORLD raster channel    */
/* (alpha-test discards the white sclera, depth test + small camera push     */
/* keeps the dark iris visible). rt_eye_depthPush tunes the coplanar offset. */
set rt_eye_worldRaster 1
set rt_eye_depthPush 0.2
set rt_flare_opacity 0.15    /* opacity scale (0 = off, 0.15 = subtle glow, 1.0 = full) for light flare / glare effects */
set rt_pbr_enable 1          /* 1 = per-material PBR roughness/metallic from pbr_materials.cfg + SL_SPECULAR */
set rt_pbr_roughnessScale 1.0 /* global multiplier on per-material roughness */
set rt_pbr_metallicScale 1.0 /* global multiplier on per-material metallic */

/* --- P4: imported lights (viewLight -> RgLight) --- */
set rt_light_enable 1         /* master: 0 disables all imported lights (lights off) */
set rt_light_intensity 4000   /* base sphere/spot intensity anchored at refRadius=70 (calibrated for Cookie * Falloff) */
set rt_light_sizeExponent 1.8 /* scale intensity by (extent/refRadius)^1.8 so room/hall lights reach their full Doom volume */
set rt_light_refRadius 70     /* extent (Doom units, ~p25 small fixture lamp) that maps to base intensity 4000 */
set rt_light_dirIntensity 2    /* illuminance (lux) for imported parallel/directional lights; active now that rt_light_skipParallel 0 */
set rt_light_skipParallel 0    /* 0 = import map-scale parallel lights (tiny <500 parallel lights like light_5262/5351 are auto-skipped) */
set rt_light_radiusScale 0.08 /* emitter sphere radius scale (raw Doom units) */
set rt_light_maxLights 0      /* per-frame light budget, 0 = unlimited (<4096) */
set rt_light_spotAngle 45     /* projected/cookie light outer cone, degrees */
set rt_light_skipFog 1        /* skip fog lights (no RTGL1 equivalent) */
set rt_light_skipBlend 1      /* skip subtractive blend lights */
set rt_light_skipNoShadows 0
set rt_light_skipSkyLights 1   /* skip fake ambient sky point lights (lights/*sky*, e.g. light_4874 outside kitchen) */  /* keep noShadow lights (RTGL1 shadows are physical) */
set rt_light_skipNoInteractions 0 /* skip lights with 0 visible interactions (0 = off, avoids light popping on view rotation) */
set rt_light_maxRadius 3500      /* skip lights with raw radius > 3500 (keeps hangar fill lights ~2114 while skipping sky domes >4800) */
set rt_light_cullFrustumBounds 0 /* 0 = off, let GPU OBB bounds handle volume clipping to avoid culling ceiling lights */
set rt_light_useBoundsAndCookie 1 /* 1 = pass Doom 3 OBB/frustum lightProject + 2D cookie & falloff textures to RTGL1 */

/* --- P4: optional directional sun (ambient fill / debug) --- */
set rt_sun_enable 0           /* 1 = inject one directional sun */
set rt_sun_intensity 0        /* lux-like; raise when rt_sun_enable=1 */
set rt_sun_dirX 0.3           /* direction from sun toward scene */
set rt_sun_dirY 0.3
set rt_sun_dirZ -1.0

/* --- P4: sky backdrop + sky lighting (ray-miss, NOT a light source) --- */
set rt_sky_colorR 0.10        /* linear backdrop color */
set rt_sky_colorG 0.12
set rt_sky_colorB 0.16
set rt_sky_brightness 1.0     /* skyColorMultiplier, visible backdrop (2026-11-14 restored) */
set rt_sky_light 2.0          /* skyLightMultiplier, indirect/ambient fill (2026-11-14 restored) */
set rt_sky_lightScale 1.0     /* live skyLightScale (2026-11-14 restored) */

/* --- P4: illumination / GI --- */
set rt_bounce_enableSecond 1  /* second bounce for indirect (GI + reflections) */
set rt_bounce_maxShadows 2    /* shadow rays per bounce */
set rt_gi_sensitivity 0.5     /* directDiffuseSensitivityToChange */
