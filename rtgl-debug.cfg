/*
===========================================================================
 rtgl-debug.cfg - P2 / P2.5 / P4 debug pins for the RTGL1 backend.

 Apply from the launcher with:  +exec rtgl-debug.cfg

 Intentionally NOT auto-loaded and not the shared DoomConfig.cfg / dhewm.cfg.
 All rt_dbg_* / rt_light_* / rt_sun_* / rt_sky_* / rt_bounce_* / rt_gi_*
 cvars are non-ARCHIVE, so nothing here is persisted into the per-user config
 and nothing leaks into the stock OpenGL backend.

 Note: Doom 3 config files only understand slash-star comments.

 See rt/RTGL1.json developerMode + RTGL1's own ImGui debug panel for the
 free debug layer (ALBEDO_WHITE / NORMALS / MOTION_VECTORS / GRADIENTS).
 The engine-side layer below complements it.
===========================================================================
*/

/* --- ID / geometry validation --- */
set rt_dbg_validateIDs 1      /* report duplicate uniqueObjectID per frame */
set rt_dbg_stats 60           /* print geo+light stats every 60 frames, 0 = off */
set rt_dbg_dumpLights 60     /* (C) per-light list every 60 frames, nearest-first + d=dist-to-cam + world aabb; view with win_viewlog 1 */
set rt_dbg_printRepeat 300     /* suppress repeated RTGL1 log messages: print 1st, then every 300 (0 = no throttle) */

/* --- per-primitive debug coloring (engine-side override of albedo) --- */
/* 0 normal (white, real textures show through) */
/* 1 uniqueObjectID hash   2 static=green / dynamic=red */
/* 3 primIndex hash        4 entityDef index hash   5 material name hash */
set rt_dbg_colorMode 0

/* --- geometry submission controls --- */
set rt_dbg_skipSubViews 1     /* skip mirror/camera/xray subview geometry (P5) */
set rt_dbg_maxSurfs 0         /* 0 = unlimited; cap for perf bisect */
set rt_dbg_bounds 0           /* reserved: rasterized AABB/normal overlay (P5) */

/* --- P4: light-source visualization (A) + enhanced dump (C) --- */
/* (A) rt_dbg_lightViz draws each sphere/spot light as in-scene geometry at  */
/*     its TRUE uploaded radius (after rt_light_radiusScale). Walls occlude  */
/*     it and it follows the camera. Directional lights have no finite bound */
/*     and are not drawn. Emissive look is a runtime visual check.           */
set rt_dbg_lightViz 1        /* 0 off, 1 solid emissive sphere, 2 wireframe rings */

/* --- P3: multiply-blend decals (scorch/grime) --- */
/* Doom 3 decal TGAs are 24-bit (NO alpha): transparency is encoded in RGB */
/* via multiply blends (white=transparent). rt_decal_mode=1 BAKES a       */
/* coverage alpha from RGB so RTGL1 alpha-test can discard identity       */
/* texels. 0 legacy, 1 baked-alpha cutout (default), 2 skip, 3 DECAL      */
/* overlay. Detection is by blend bits (catches 'sort 1' decals too).     */
/* NOTE: code defaults already apply without this cfg.                      */
set rt_decal_mode 1
set rt_emissive_enable 1      /* 1 = enable mesh-light emission from blend-add surfaces (2026-11-14 restored) */
set rt_emissive_mult 0.001      /* low multiplier: restored emission without the 11-13 GI flood */
set rt_normalmap_enable 1    /* bind Doom3 bump maps as in-memory normal maps (Plan B) */

/* --- P4: imported lights (viewLight -> RgLight) --- */
set rt_light_enable 1         /* master: 0 disables all imported lights (lights off) */
set rt_light_intensity 20000  /* base sphere/spot intensity; 20000 = visible with the fixed encodeE5 DLL (2026-11-14) */
set rt_light_sizeExponent 0   /* OFF (2026-11-13 fix): >0 cut small lamps' energy and darkened the scene; 0 = no per-light energy cut */
set rt_light_refRadius 256    /* extent (Doom units) that maps to the unscaled base intensity */
set rt_light_dirIntensity 2    /* illuminance (lux) for imported parallel/directional lights; active now that rt_light_skipParallel 0 */
set rt_light_skipParallel 0    /* 0 (default, 2026-11-14 restored): import p.parallel lights as directional. NOTE: can reintroduce the ~5 deg camera-rotation bright/dark pop (mars_city1 light_5262/light_5351) because RTGL1 directional is a GLOBAL unbounded sun gated by a per-frame bool while Doom3 parallel lights are bounded/frustum-culled; set 1 to skip again, or use rt_sun_enable for a view-independent global sun. */
set rt_light_radiusScale 0.02 /* radius scale; Doom lightRadius is an extent, not an emitter size */
set rt_light_maxLights 0      /* per-frame light budget, 0 = unlimited (<4096) */
set rt_light_spotAngle 45     /* projected/cookie light outer cone, degrees */
set rt_light_skipFog 1        /* skip fog lights (no RTGL1 equivalent) */
set rt_light_skipBlend 1      /* skip subtractive blend lights */
set rt_light_skipNoShadows 0  /* keep noShadow lights (RTGL1 shadows are physical) */
set rt_light_skipNoInteractions 1 /* skip lights with 0 visible interactions (stops sky/distant lights bleeding inside) */
set rt_light_maxRadius 2000      /* skip lights with raw radius > 2000 (0 = unlimited); prevents massive sky lights from flooding */
set rt_light_cullFrustumBounds 1 /* 1 = skip point lights whose volume bottom is far above camera view */

/* --- P4: optional directional sun (ambient fill / debug) --- */
set rt_sun_enable 0           /* 1 = inject one directional sun */
set rt_sun_intensity 0        /* lux-like; raise when rt_sun_enable=1 */
set rt_sun_dirX 0.3           /* direction from sun toward scene */
set rt_sun_dirY 0.3
set rt_sun_dirZ -1.0

/* --- P4: sky backdrop + sky lighting (ray-miss, NOT a light source) --- */
set rt_sky_colorR 0.10        /* linear backdrop color */
set rt_sky_colorG 0.12
set rt_sky_colorB 0.16
set rt_sky_brightness 0.5     /* skyColorMultiplier, visible backdrop (2026-11-14 restored) */
set rt_sky_light 2.0          /* skyLightMultiplier, indirect/ambient fill (2026-11-14 restored) */
set rt_sky_lightScale 1.0     /* live skyLightScale (2026-11-14 restored) */

/* --- P4: illumination / GI --- */
set rt_bounce_enableSecond 1  /* second bounce for indirect (GI + reflections) */
set rt_bounce_maxShadows 2    /* shadow rays per bounce */
set rt_gi_sensitivity 0.5     /* directDiffuseSensitivityToChange */
